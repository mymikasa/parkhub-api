name: Main CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Main Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.67.0

      - name: make proto-lint
        run: make proto-lint

      - name: Fetch main for breaking check
        if: github.event_name == 'pull_request'
        run: git fetch origin main:main

      - name: make proto-breaking
        if: github.event_name == 'pull_request'
        run: make proto-breaking

      - name: go vet
        run: go vet ./...

      - name: go test
        run: make test

      - name: make build-monolith
        run: make build-monolith
