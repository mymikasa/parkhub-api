syntax = "proto3";

package parkhub.identity.v1;

option go_package = "github.com/parkhub/api/internal/gen/api/proto/identity/v1;identityv1";

import "identity/v1/user.proto";

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 access_expires_in = 3;
  string token_type = 4;
  User user = 5;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 access_expires_in = 3;
  string token_type = 4;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message GetJWKSRequest {}

message GetJWKSResponse {
  bytes jwks_json = 1;
}

message SmsLoginRequest {
  string phone = 1;
  string code = 2;
}

message SmsLoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 access_expires_in = 3;
  string token_type = 4;
  User user = 5;
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc SmsLogin(SmsLoginRequest) returns (SmsLoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetJWKS(GetJWKSRequest) returns (GetJWKSResponse);
}
