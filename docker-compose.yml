services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: parkhub
      MYSQL_USER: parkhub
      MYSQL_PASSWORD: parkhub
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pparkhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  etcd:
    image: bitnamilegacy/etcd:3.6.4-debian-12-r4
    restart: unless-stopped
    ports:
      - "2379:2379"
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
    volumes:
      - etcd_data:/bitnami/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  sms:
    build:
      context: .
      dockerfile: services/sms/Dockerfile
    restart: unless-stopped
    ports:
      - "50053:50053"
      - "9093:9093"
      - "8082:8082"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: parkhub
      DB_PASSWORD: parkhub
      DB_NAME: parkhub_identity
      REDIS_ADDR: redis:6379
      OTEL_TRACE_ENDPOINT: tempo:4317
      GRPC_PORT: "50053"
      METRICS_PORT: "9093"
      HTTP_HEALTH_PORT: "8082"
      LOG_FORMAT: json
      LOG_LEVEL: info
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    restart: unless-stopped
    ports:
      - "50052:50052"
      - "9094:9092"
      - "8083:8083"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: parkhub
      DB_PASSWORD: parkhub
      DB_NAME: parkhub_identity
      REDIS_ADDR: redis:6379
      SMS_CLIENT_ADDR: sms:50053
      AUTH_ISSUER: parkhub
      AUTH_ACCESS_TTL: 15m
      AUTH_REFRESH_TTL: 168h
      AUTH_PRIVATE_KEY_PATH: /keys/jwt_private.pem
      AUTH_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      AUTH_KEY_ID: parkhub-rs256-01
      OTEL_TRACE_ENDPOINT: tempo:4317
      GRPC_PORT: "50052"
      METRICS_PORT: "9092"
      HTTP_HEALTH_PORT: "8083"
      LOG_FORMAT: json
      LOG_LEVEL: info
    volumes:
      - ./configs/keys:/keys:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      sms:
        condition: service_started

  iot:
    build:
      context: .
      dockerfile: services/iot/Dockerfile
    restart: unless-stopped
    ports:
      - "50054:50054"
      - "9095:9092"
      - "8084:8084"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: parkhub
      DB_PASSWORD: parkhub
      DB_NAME: parkhub_iot
      OTEL_TRACE_ENDPOINT: tempo:4317
      GRPC_PORT: "50054"
      METRICS_PORT: "9092"
      HTTP_HEALTH_PORT: "8084"
      LOG_FORMAT: json
      LOG_LEVEL: info
    depends_on:
      mysql:
        condition: service_healthy

  parking:
    build:
      context: .
      dockerfile: services/parking/Dockerfile
    restart: unless-stopped
    ports:
      - "50055:50055"
      - "9096:9092"
      - "8085:8085"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: parkhub
      DB_PASSWORD: parkhub
      DB_NAME: parkhub_parking
      IOT_SERVICE_ADDR: "iot:50054"
      OTEL_TRACE_ENDPOINT: tempo:4317
      GRPC_PORT: "50055"
      METRICS_PORT: "9092"
      HTTP_HEALTH_PORT: "8085"
      LOG_FORMAT: json
      LOG_LEVEL: info
    depends_on:
      mysql:
        condition: service_healthy
      iot:
        condition: service_started

  monolith:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "50051:50051"
      - "9090:9090"
      - "8080:8080"
    environment:
      OTEL_TRACE_ENDPOINT: tempo:4317
      GRPC_PORT: "50051"
      METRICS_PORT: "9090"
      HTTP_HEALTH_PORT: "8080"
      LOG_FORMAT: json
      LOG_LEVEL: info

  apisix:
    image: apache/apisix:3.15.0-debian
    restart: unless-stopped
    ports:
      - "9080:9080"
      - "9091:9091"
      - "9180:9180"
    depends_on:
      etcd:
        condition: service_healthy
    volumes:
      - ./configs/apisix/config.yaml:/usr/local/apisix/conf/config.yaml

  init-apisix:
    image: curlimages/curl:latest
    restart: "no"
    depends_on:
      apisix:
        condition: service_started
      monolith:
        condition: service_started
      identity:
        condition: service_started
      sms:
        condition: service_started
      iot:
        condition: service_started
      parking:
        condition: service_started
    entrypoint: ["sh", "/scripts/init-apisix.sh"]
    volumes:
      - ./scripts/init-apisix.sh:/scripts/init-apisix.sh:ro
      - ./configs/apisix/proto-descriptor.pb:/proto/proto-descriptor.pb:ro
      - ./configs/keys:/keys:ro

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./configs/swagger/openapi.yaml:/usr/share/nginx/html/openapi.yaml:ro
    environment:
      SWAGGER_JSON_URL: openapi.yaml

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    restart: unless-stopped
    ports:
      - "8428:8428"
    volumes:
      - vm_data:/victoria-metrics-data
      - ./configs/victoriametrics/scrape.yaml:/etc/vm/scrape.yaml:ro
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=:8428"
      - "--promscrape.config=/etc/vm/scrape.yaml"

  tempo:
    image: grafana/tempo:2.3.1
    restart: unless-stopped
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./configs/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    command:
      - "-config.file=/etc/tempo/tempo.yaml"

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    volumes:
      - ./configs/promtail/promtail.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "-config.file=/etc/promtail/config.yaml"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - victoriametrics
      - loki
      - tempo

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  etcd_data:
  vm_data:
  tempo_data:
  loki_data:
  grafana_data:
