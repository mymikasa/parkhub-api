openapi: 3.0.3

info:
  title: ParkHub API
  description: ParkHub SaaS 停车管理系统后端 API
  version: 1.0.0

servers:
  - url: http://localhost:9080
    description: 本地开发环境

tags:
  - name: Auth
    description: 认证鉴权
  - name: SMS
    description: 短信验证码
  - name: User
    description: 用户管理
  - name: Tenant
    description: 租户管理
  - name: ParkingLot
    description: 停车场管理
  - name: Device
    description: IoT 设备管理

components:
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
      description: 租户ID

    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
      description: 用户ID

    DeviceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 设备ID

  schemas:
    PaginationRequest:
      type: object
      properties:
        page:
          type: integer
          format: int32
          default: 1
        page_size:
          type: integer
          format: int32
          default: 20

    PaginationResponse:
      type: object
      properties:
        page:
          type: integer
          format: int32
        page_size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int32

    Timestamp:
      type: object
      properties:
        seconds:
          type: integer
          format: int64
        nanos:
          type: integer
          format: int32

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    TenantStatus:
      type: string
      enum:
        - TENANT_STATUS_UNSPECIFIED
        - TENANT_STATUS_ACTIVE
        - TENANT_STATUS_FROZEN

    PlanType:
      type: string
      enum:
        - PLAN_TYPE_UNSPECIFIED
        - PLAN_TYPE_FREE
        - PLAN_TYPE_BASIC
        - PLAN_TYPE_PRO
        - PLAN_TYPE_ENTERPRISE

    Tenant:
      type: object
      properties:
        tenant_id:
          type: string
        name:
          type: string
        contact_name:
          type: string
        contact_phone:
          type: string
        contact_email:
          type: string
        status:
          $ref: '#/components/schemas/TenantStatus'
        address:
          type: string
        plan_type:
          $ref: '#/components/schemas/PlanType'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        description:
          type: string
        credit_code:
          type: string
        remark:
          type: string
        parking_lot_count:
          type: integer
          format: int32
          readOnly: true

    CreateTenantRequest:
      type: object
      required:
        - name
        - contact_name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        contact_name:
          type: string
          minLength: 1
        contact_phone:
          type: string
        contact_email:
          type: string
        address:
          type: string
        plan_type:
          $ref: '#/components/schemas/PlanType'
        description:
          type: string
        credit_code:
          type: string
        remark:
          type: string

    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
        contact_name:
          type: string
        contact_phone:
          type: string
        contact_email:
          type: string
        address:
          type: string
        plan_type:
          $ref: '#/components/schemas/PlanType'
        description:
          type: string
        credit_code:
          type: string
        remark:
          type: string

    UserRole:
      type: string
      enum:
        - USER_ROLE_UNSPECIFIED
        - USER_ROLE_PLATFORM_ADMIN
        - USER_ROLE_TENANT_ADMIN
        - USER_ROLE_OPERATOR

    UserStatus:
      type: string
      enum:
        - USER_STATUS_UNSPECIFIED
        - USER_STATUS_ACTIVE
        - USER_STATUS_FROZEN

    User:
      type: object
      properties:
        user_id:
          type: string
        tenant_id:
          type: string
        username:
          type: string
        email:
          type: string
        phone:
          type: string
        real_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        last_login_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        access_expires_in:
          type: integer
          format: int32
          description: Access Token 有效期（秒）
        token_type:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    RefreshTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        access_expires_in:
          type: integer
          format: int32
        token_type:
          type: string
          example: Bearer

    LogoutRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    SmsPurpose:
      type: string
      enum:
        - SMS_PURPOSE_UNSPECIFIED
        - SMS_PURPOSE_LOGIN
        - SMS_PURPOSE_REGISTER
        - SMS_PURPOSE_RESET_PASSWORD

    SendSmsCodeRequest:
      type: object
      required:
        - phone
        - purpose
      properties:
        phone:
          type: string
          description: 手机号
        purpose:
          $ref: '#/components/schemas/SmsPurpose'

    SendSmsCodeResponse:
      type: object
      description: 发送成功返回空对象

    SmsLoginRequest:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          type: string
          description: 手机号
        code:
          type: string
          description: 短信验证码

    CreateUserRequest:
      type: object
      required:
        - username
        - password
        - real_name
        - role
      properties:
        tenant_id:
          type: string
        username:
          type: string
        password:
          type: string
          minLength: 8
        email:
          type: string
        phone:
          type: string
        real_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        phone:
          type: string
        real_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    UpdateProfileRequest:
      type: object
      properties:
        real_name:
          type: string
        email:
          type: string
        phone:
          type: string

    ResetPasswordRequest:
      type: object
      required:
        - new_password
      properties:
        new_password:
          type: string
          minLength: 8

    ChangePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
        new_password:
          type: string
          minLength: 8

    ImportUserItem:
      type: object
      required:
        - username
        - password
        - real_name
        - role
      properties:
        tenant_id:
          type: string
        username:
          type: string
        password:
          type: string
        email:
          type: string
        phone:
          type: string
        real_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    ImportUsersRequest:
      type: object
      required:
        - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/ImportUserItem'

    ImportError:
      type: object
      properties:
        index:
          type: integer
          format: int32
        message:
          type: string

    ImportUsersResponse:
      type: object
      properties:
        total:
          type: integer
          format: int32
        success:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ImportError'

    LotType:
      type: string
      enum:
        - LOT_TYPE_UNSPECIFIED
        - LOT_TYPE_UNDERGROUND
        - LOT_TYPE_GROUND
        - LOT_TYPE_STEREO

    ParkingLotStatus:
      type: string
      enum:
        - PARKING_LOT_STATUS_UNSPECIFIED
        - PARKING_LOT_STATUS_ACTIVE
        - PARKING_LOT_STATUS_INACTIVE

    ParkingLot:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        address:
          type: string
        total_spaces:
          type: integer
          format: int32
        available_spaces:
          type: integer
          format: int32
        lot_type:
          $ref: '#/components/schemas/LotType'
        status:
          $ref: '#/components/schemas/ParkingLotStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    CreateParkingLotRequest:
      type: object
      required:
        - name
        - address
        - total_spaces
        - lot_type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          minLength: 1
          maxLength: 255
        total_spaces:
          type: integer
          format: int32
          minimum: 1
        lot_type:
          $ref: '#/components/schemas/LotType'

    UpdateParkingLotRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        total_spaces:
          type: integer
          format: int32
        lot_type:
          $ref: '#/components/schemas/LotType'
        status:
          $ref: '#/components/schemas/ParkingLotStatus'

    ParkingLotStatsResponse:
      type: object
      properties:
        total_spaces:
          type: integer
          format: int64
        available_spaces:
          type: integer
          format: int64
        occupied_vehicles:
          type: integer
          format: int64
        total_gates:
          type: integer
          format: int64

    TenantSummaryResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
          description: 租户总数
        active:
          type: integer
          format: int64
          description: 活跃租户数
        frozen:
          type: integer
          format: int64
          description: 冻结租户数
        total_parking_lots:
          type: integer
          format: int64
          description: 停车场总数
        avg_parking_lots_per_tenant:
          type: number
          format: double
          description: 平均每租户停车场数

    DeviceType:
      type: string
      enum:
        - DEVICE_TYPE_INTEGRATED
        - DEVICE_TYPE_CAMERA_ONLY
        - DEVICE_TYPE_BARRIER_ONLY

    DeviceStatus:
      type: string
      enum:
        - DEVICE_STATUS_PENDING
        - DEVICE_STATUS_ACTIVE
        - DEVICE_STATUS_OFFLINE
        - DEVICE_STATUS_DISABLED

    Device:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/DeviceType'
        status:
          $ref: '#/components/schemas/DeviceStatus'
        firmware_version:
          type: string
        last_heartbeat:
          $ref: '#/components/schemas/Timestamp'
        parking_lot_id:
          type: string
          nullable: true
        gate_id:
          type: string
          nullable: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    CreateDeviceRequest:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          description: 设备序列号
        name:
          type: string
        type:
          $ref: '#/components/schemas/DeviceType'
        firmware_version:
          type: string

    UpdateDeviceNameRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    BindDeviceRequest:
      type: object
      required:
        - parking_lot_id
        - gate_id
      properties:
        parking_lot_id:
          type: string
        gate_id:
          type: string

    BatchBindDeviceItem:
      type: object
      required:
        - id
        - parking_lot_id
        - gate_id
      properties:
        id:
          type: string
        parking_lot_id:
          type: string
        gate_id:
          type: string

    BatchIdsRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string

    BatchBindDevicesRequest:
      type: object
      required:
        - bindings
      properties:
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/BatchBindDeviceItem'

    BatchAffectedResponse:
      type: object
      properties:
        affected:
          type: integer
          format: int32

    DeviceStatsResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        active:
          type: integer
          format: int64
        offline:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
        disabled:
          type: integer
          format: int64

    SendDeviceCommandRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum: [up, down]
          description: up=抬杆, down=落杆

    SendDeviceCommandResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    securitySchemes:
      BearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT

security: []

paths:
  /identity/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 用户名或密码错误 / 用户已冻结

  /identity/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: 刷新 Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Refresh Token 无效 / 已过期 / 已被吊销

  /identity/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 登出
      description: 吊销 Refresh Token，重复调用幂等成功
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: 登出成功
        '401':
          description: Refresh Token 无效

  /identity/v1/auth/jwks:
    get:
      tags: [Auth]
      operationId: getJWKS
      summary: 获取 JWKS 公钥
      description: 导出 RS256 公钥（RFC 7517），用于调试，不作为 APISIX 主配置来源
      responses:
        '200':
          description: JWKS JSON
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwks_json:
                    type: string
                    format: byte

  /identity/v1/auth/sms/send:
    post:
      tags: [SMS]
      operationId: sendSmsCode
      summary: 发送短信验证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendSmsCodeRequest'
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendSmsCodeResponse'
        '400':
          description: 手机号格式错误
        '429':
          description: 发送频率限制

  /identity/v1/auth/sms/login:
    post:
      tags: [SMS]
      operationId: smsLogin
      summary: 短信验证码登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 验证码错误或已过期
        '401':
          description: 用户不存在或已冻结

  /identity/v1/users/me:
    get:
      tags: [User]
      operationId: getCurrentUser
      summary: 获取当前登录用户信息
      description: 从 JWT 中提取用户ID，返回当前用户详情。用于路由守卫 / token 续签场景。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: 未认证 / Token 无效

  /identity/v1/users:
    post:
      tags: [User]
      operationId: createUser
      summary: 创建用户
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: 参数错误
        '409':
          description: 用户已存在

    get:
      tags: [User]
      operationId: listUsers
      summary: 获取用户列表
      security:
        - BearerAuth: []
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: keyword
          in: query
          schema:
            type: string
          description: 按用户名/姓名搜索
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/PaginationResponse'
        '401':
          description: 未认证

  /identity/v1/users/import:
    post:
      tags: [User]
      operationId: importUsers
      summary: 批量导入用户
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportUsersRequest'
      responses:
        '200':
          description: 导入完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportUsersResponse'
        '401':
          description: 未认证

  /identity/v1/users/{user_id}:
    get:
      tags: [User]
      operationId: getUser
      summary: 获取用户详情
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: 未认证
        '404':
          description: 用户不存在

    put:
      tags: [User]
      operationId: updateUser
      summary: 更新用户
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: 未认证
        '404':
          description: 用户不存在

  /identity/v1/users/{user_id}/freeze:
    post:
      tags: [User]
      operationId: freezeUser
      summary: 冻结用户
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 冻结成功
        '401':
          description: 未认证
        '404':
          description: 用户不存在

  /identity/v1/users/{user_id}/unfreeze:
    post:
      tags: [User]
      operationId: unfreezeUser
      summary: 解冻用户
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 解冻成功
        '401':
          description: 未认证
        '404':
          description: 用户不存在

  /identity/v1/users/{user_id}/reset-password:
    post:
      tags: [User]
      operationId: resetPassword
      summary: 重置密码（管理员）
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: 重置成功
        '401':
          description: 未认证
        '404':
          description: 用户不存在

  /identity/v1/users/{user_id}/profile:
    put:
      tags: [User]
      operationId: updateProfile
      summary: 更新个人资料
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: 未认证
        '404':
          description: 用户不存在

  /identity/v1/users/{user_id}/change-password:
    post:
      tags: [User]
      operationId: changePassword
      summary: 修改密码
      security:
        - BearerAuth: []
      parameters:
