openapi: 3.0.3

info:
  title: ParkHub API
  description: ParkHub SaaS 停车管理系统后端 API
  version: 1.0.0

servers:
  - url: http://localhost:9080
    description: 本地开发环境

tags:
  - name: Tenant
    description: 租户管理
  - name: User
    description: 用户管理

components:
  schemas:
    PaginationRequest:
      type: object
      properties:
        page:
          type: integer
          format: int32
          default: 1
        page_size:
          type: integer
          format: int32
          default: 20

    PaginationResponse:
      type: object
      properties:
        page:
          type: integer
          format: int32
        page_size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int32

    TenantStatus:
      type: string
      enum:
        - TENANT_STATUS_UNSPECIFIED
        - TENANT_STATUS_ACTIVE
        - TENANT_STATUS_FROZEN

    PlanType:
      type: string
      enum:
        - PLAN_TYPE_UNSPECIFIED
        - PLAN_TYPE_FREE
        - PLAN_TYPE_BASIC
        - PLAN_TYPE_PRO
        - PLAN_TYPE_ENTERPRISE

    UserRole:
      type: string
      enum:
        - USER_ROLE_UNSPECIFIED
        - USER_ROLE_PLATFORM_ADMIN
        - USER_ROLE_TENANT_ADMIN
        - USER_ROLE_OPERATOR

    UserStatus:
      type: string
      enum:
        - USER_STATUS_UNSPECIFIED
        - USER_STATUS_ACTIVE
        - USER_STATUS_FROZEN

    Timestamp:
      type: object
      properties:
        seconds:
          type: integer
          format: int64
        nanos:
          type: integer
          format: int32

    Tenant:
      type: object
      properties:
        tenant_id:
          type: string
        name:
          type: string
        contact_name:
          type: string
        contact_phone:
          type: string
        contact_email:
          type: string
        status:
          $ref: '#/components/schemas/TenantStatus'
        address:
          type: string
        plan_type:
          $ref: '#/components/schemas/PlanType'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    User:
      type: object
      properties:
        user_id:
          type: string
        tenant_id:
          type: string
          nullable: true
        username:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        real_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        last_login_at:
          $ref: '#/components/schemas/Timestamp'
          nullable: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    CreateTenantRequest:
      type: object
      required:
        - name
        - contact_name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        contact_name:
          type: string
          minLength: 1
        contact_phone:
          type: string
        contact_email:
          type: string
        address:
          type: string
        plan_type:
          $ref: '#/components/schemas/PlanType'

    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
        contact_name:
          type: string
        contact_phone:
          type: string
        contact_email:
          type: string
        address:
          type: string
        plan_type:
          $ref: '#/components/schemas/PlanType'
        status:
          $ref: '#/components/schemas/TenantStatus'

    CreateUserRequest:
      type: object
      required:
        - username
        - password
        - real_name
        - role
      properties:
        tenant_id:
          type: string
          nullable: true
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 8
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        real_name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: '#/components/schemas/UserRole'

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        real_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    UpdateProfileRequest:
      type: object
      properties:
        real_name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true

    ResetPasswordRequest:
      type: object
      required:
        - new_password
      properties:
        new_password:
          type: string
          minLength: 8

    ChangePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
        new_password:
          type: string
          minLength: 8

    ImportUserItem:
      type: object
      required:
        - username
        - password
        - real_name
        - role
      properties:
        tenant_id:
          type: string
          nullable: true
        username:
          type: string
        password:
          type: string
          minLength: 8
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        real_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    ImportError:
      type: object
      properties:
        index:
          type: integer
          format: int32
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

paths:
  /api/v1/tenants:
    post:
      tags: [Tenant]
      operationId: createTenant
      summary: 创建租户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant:
                    $ref: '#/components/schemas/Tenant'
        '400':
          description: 参数错误
        '409':
          description: 租户已存在

    get:
      tags: [Tenant]
      operationId: listTenants
      summary: 获取租户列表
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TenantStatus'
        - name: keyword
          in: query
          schema:
            type: string
          description: 按名称/联系人搜索
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'
                  pagination:
                    $ref: '#/components/schemas/PaginationResponse'

  /api/v1/tenants/{tenant_id}:
    get:
      tags: [Tenant]
      operationId: getTenant
      summary: 获取租户详情
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant:
                    $ref: '#/components/schemas/Tenant'
        '404':
          description: 租户不存在

    put:
      tags: [Tenant]
      operationId: updateTenant
      summary: 更新租户
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant:
                    $ref: '#/components/schemas/Tenant'
        '404':
          description: 租户不存在

    delete:
      tags: [Tenant]
      operationId: deleteTenant
      summary: 删除租户
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: 删除成功
        '404':
          description: 租户不存在

  /api/v1/users:
    post:
      tags: [User]
      operationId: createUser
      summary: 创建用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: 参数错误（密码不足8位、角色无效等）
        '409':
          description: 用户名已存在

    get:
      tags: [User]
      operationId: listUsers
      summary: 获取用户列表
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
          description: 按租户ID过滤（空=全部）
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: keyword
          in: query
          schema:
            type: string
          description: 按用户名/姓名/邮箱搜索
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/PaginationResponse'

  /api/v1/users/import:
    post:
      tags: [User]
      operationId: importUsers
      summary: 批量导入用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - users
              properties:
                users:
                  type: array
                  items:
                    $ref: '#/components/schemas/ImportUserItem'
      responses:
        '200':
          description: 导入完成（包含部分失败信息）
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    format: int32
                  success:
                    type: integer
                    format: int32
                  failed:
                    type: integer
                    format: int32
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImportError'

  /api/v1/users/{user_id}:
    get:
      tags: [User]
      operationId: getUser
      summary: 获取用户详情
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '404':
          description: 用户不存在

    put:
      tags: [User]
      operationId: updateUser
      summary: 更新用户信息（管理端）
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '404':
          description: 用户不存在

  /api/v1/users/{user_id}/freeze:
    put:
      tags: [User]
      operationId: freezeUser
      summary: 冻结用户
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 冻结成功
        '400':
          description: 用户已冻结
        '404':
          description: 用户不存在

  /api/v1/users/{user_id}/unfreeze:
    put:
      tags: [User]
      operationId: unfreezeUser
      summary: 解冻用户
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 解冻成功
        '400':
          description: 用户未冻结
        '404':
          description: 用户不存在

  /api/v1/users/{user_id}/reset-password:
    put:
      tags: [User]
      operationId: resetPassword
      summary: 重置用户密码（管理端）
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: 重置成功
        '400':
          description: 密码不足8位
        '404':
          description: 用户不存在

  /api/v1/users/{user_id}/profile:
    put:
      tags: [User]
      operationId: updateProfile
      summary: 更新用户资料（用户自行修改）
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '404':
          description: 用户不存在

  /api/v1/users/{user_id}/change-password:
    put:
      tags: [User]
      operationId: changePassword
      summary: 修改密码（需提供旧密码）
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 修改成功
        '400':
          description: 旧密码错误或新密码不足8位
        '404':
          description: 用户不存在

parameters:
  TenantId:
    name: tenant_id
    in: path
    required: true
    schema:
      type: string
    description: 租户ID

  UserId:
    name: user_id
    in: path
    required: true
    schema:
      type: string
    description: 用户ID
