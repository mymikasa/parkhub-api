server:
  grpc_port: 50051
  metrics_port: 9090
  http_health_port: 8080

database:
  host: localhost
  port: 3306
  user: parkhub
  password: parkhub
  dbname: parkhub_identity

auth:
  issuer: parkhub
  access_ttl: 15m
  refresh_ttl: 168h
  private_key_path: configs/keys/jwt_private.pem
  public_key_path: configs/keys/jwt_public.pem
  key_id: parkhub-2026-04

telemetry:
  service_name: parkhub-monolith
  environment: development
  log:
    level: info
    format: json
  trace:
    endpoint: localhost:4317
    insecure: true
    sampling_ratio: 1.0
  metrics:
    path: /metrics
