# ──────────────────────────────────────────────
# Protected routes (require jwt-auth)
# ──────────────────────────────────────────────

# Example: protected identity routes with jwt-auth + identity header injection
# curl http://localhost:9180/apisix/admin/routes/identity-protected -H 'X-API-KEY: ...' -X PUT -d '{
#   "uri": "/identity/v1/*",
#   "methods": ["GET", "POST", "PUT", "PATCH"],
#   "upstream": {
#     "scheme": "grpc",
#     "type": "roundrobin",
#     "nodes": { "grpc_server:50051": 1 }
#   },
#   "plugins": {
#     "jwt-auth": {
#       "consumer": "jwt"
#     },
#     "proxy-rewrite": {
#       "headers": {
#         "set": {
#           "x-user-id": "$jwt_payload.user_id",
#           "x-tenant-id": "$jwt_payload.tenant_id",
#           "x-user-role": "$jwt_payload.role"
#         }
#       }
#     },
#     "grpc-transcode": {
#       "proto_id": "proto-descriptor",
#       "service": "parkhub.identity.v1.UserService",
#       "method": "GetUser"
#     }
#   }
# }'

