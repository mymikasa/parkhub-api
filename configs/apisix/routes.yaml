# APISIX Auth Routes for ParkHub
#
# Apply with:
#   curl http://localhost:9180/apisix/admin/routes/1 -H 'X-API-KEY: ...' -X PUT -d @routes.yaml
#
# Prerequisites:
#   - jwt-auth plugin enabled
#   - grpc-transcode plugin enabled
#   - Upstream gRPC server at grpc_server:50051
#
# Security note:
#   The gRPC port (50051) must NOT be exposed externally.
#   Only APISIX should reach the backend directly.

# ──────────────────────────────────────────────
# JWT Auth Consumer (shared across protected routes)
# ──────────────────────────────────────────────

# Create consumer with jwt-auth plugin:
# curl http://localhost:9180/apisix/admin/consumers -H 'X-API-KEY: ...' -X PUT -d '{
#   "username": "jwt",
#   "plugins": {
#     "jwt-auth": {
#       "public_key": "-----BEGIN PUBLIC KEY-----\nMIIBIj...\n-----END PUBLIC KEY-----",
#       "algorithm": "RS256",
#       "key": "parkhub-2026-04"
#     }
#   }
# }'

# ──────────────────────────────────────────────
# Public routes (no jwt-auth)
# ──────────────────────────────────────────────

# Login
# curl http://localhost:9180/apisix/admin/routes/auth-login -H 'X-API-KEY: ...' -X PUT -d '{
#   "uri": "/identity/v1/auth/login",
#   "methods": ["POST"],
#   "upstream": {
#     "scheme": "grpc",
#     "type": "roundrobin",
#     "nodes": { "grpc_server:50051": 1 }
#   },
#   "plugins": {
#     "grpc-transcode": {
#       "proto_id": "proto-descriptor",
#       "service": "parkhub.identity.v1.AuthService",
#       "method": "Login"
#     }
#   }
# }'

